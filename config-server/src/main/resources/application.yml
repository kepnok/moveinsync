server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: config-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/configdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

config:
  jwt:
    secret: "MoveInSyncHierarchicalTenantConfigSuperSecretKey2026!#"
    expiration-ms: 86400000
  propagation:
    outbox-delay-ms: 200
    heartbeat-seconds: 15
    max-connections-per-service: 50

